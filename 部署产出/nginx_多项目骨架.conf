# ============================================================================
# 站点分配规则（多项目服务器）
#
# 新增项目时：
#   1) 阿里云加一条 DNS（A 记录 → 8.137.167.162；建议用通配符 *）
#   2) 复制一个 server 块，改 server_name 和 root
#   3) certbot certonly --webroot -w /var/www/acme -d 新子域名
#   4) nginx -t && systemctl reload nginx
#
# ★ 这里没有任何域名会「默认」指向某个项目。未配置的域名拿到 404。
# ============================================================================

# ---------------------------------------------------------------------------
# 1) 兜底（未配置的域名）
#    - 80: 放行 ACME 验证目录（给新子域名签证书用），其余 404
#    - 443: 用 doublemoon 的证书完成握手，然后 404
#      ⚠️ 不要用 ssl_reject_handshake —— 实测会让正常域名的 HTTPS 成功率
#         从 10/10 掉到 2/10（主动拒绝握手可能触发网络侧限流）。
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/doublemoon.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doublemoon.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        return 404;
    }
}

# ---------------------------------------------------------------------------
# 2) doublemoon.com.cn —— 暂时仍指向秘境录
#    ⚠️ 等 game.doublemoon.com.cn 就绪后改成「门户页 + 链到游戏」
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name doublemoon.com.cn www.doublemoon.com.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / {
        return 301 https://doublemoon.com.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name doublemoon.com.cn www.doublemoon.com.cn;

    ssl_certificate     /etc/letsencrypt/live/doublemoon.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doublemoon.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/mijinglu;
    index index.html;

    charset utf-8;
    server_tokens off;

    location = /index.html { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    location = /_precache.json { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /manifest.json  { add_header Cache-Control "no-cache, must-revalidate"; }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location ~ /\. { return 404; }
    location ~* \.(py|bat|sh|conf|txt|md|log|bak)$ { return 404; }

    location / { try_files $uri $uri/ =404; }

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;
}
