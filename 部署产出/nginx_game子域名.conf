# ============================================================================
# game.doublemoon.com.cn —— 秘境录
#
# ⚠️ 这个文件是【独立】的，故意不写进 mijinglu 那个文件里。
#    原因：另一会话（FATE 项目）正在改 /etc/nginx/sites-available/mijinglu
#    （2026-10-20 17:28 加了 /fate/ 子路径）。共用一个文件会互相覆盖。
#
# 新增项目时照这个文件复制一份，改 server_name / root / 证书路径即可。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name game.doublemoon.com.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / {
        return 301 https://game.doublemoon.com.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name game.doublemoon.com.cn;

    # ★ 证书路径会被签好后替换成 /etc/letsencrypt/live/game.doublemoon.com.cn/
    ssl_certificate     /etc/letsencrypt/live/doublemoon.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doublemoon.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/mijinglu;
    index index.html;

    charset utf-8;
    server_tokens off;

    # 这四个必须 no-cache：index.html / sw.js / _precache.json / manifest.json
    location = /index.html { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    location = /_precache.json { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /manifest.json  { add_header Cache-Control "no-cache, must-revalidate"; }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location ~ /\. { return 404; }
    location ~* \.(py|bat|sh|conf|txt|md|log|bak)$ { return 404; }

    location / { try_files $uri $uri/ =404; }

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;
}
