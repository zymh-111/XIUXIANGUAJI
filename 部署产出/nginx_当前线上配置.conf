# ---------------------------------------------------------------------------
# Port 80: serve the game DIRECTLY (no redirect).
#
# Why: HTTPS on this hostname is currently unreliable from mainland networks
#      (SNI-level interference -> ~90% connection reset).
#      Redirecting everything to a broken HTTPS would make the game UNREACHABLE.
#      So: plain HTTP works now; HTTPS stays available for clients where it works.
#
#      Once a properly-registered domain is in place, switch to a clean
#      "http -> 301 https" setup.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/mijinglu;
    index index.html;

    charset utf-8;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mijinglu;
        default_type text/plain;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    location = /_precache.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location ~ /\. {
        return 404;
    }
    location ~* \.(py|bat|sh|conf|txt|md|log|bak)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;
}

# ---------------------------------------------------------------------------
# Port 443: same content over HTTPS (cert covers sslip.io; add real domain later)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/8-137-167-162.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8-137-167-162.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/mijinglu;
    index index.html;

    charset utf-8;
    server_tokens off;

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    location = /_precache.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location ~ /\. {
        return 404;
    }
    location ~* \.(py|bat|sh|conf|txt|md|log|bak)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;
}
