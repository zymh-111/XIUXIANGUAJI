# HTTP: keep ACME reachable, redirect everything else to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name doublemoon.com.cn _;

    # ACME challenge must stay on plain HTTP (renewals depend on it)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mijinglu;
        default_type text/plain;
    }

    # also accept ACME "http-01" style probes on the well-known root
    location = /ping {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://doublemoon.com.cn$request_uri;
    }
}

# HTTPS: the real site
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name doublemoon.com.cn _;

    ssl_certificate     /etc/letsencrypt/live/doublemoon.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doublemoon.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/mijinglu;
    index index.html;

    charset utf-8;
    server_tokens off;

    # These four must be no-cache:
    #   index.html     - otherwise code changes are invisible
    #   sw.js          - Service Worker is cached by the BROWSER itself
    #   _precache.json - offline manifest follows the version
    #   manifest.json  - PWA metadata
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    location = /_precache.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location ~ /\. {
        return 404;
    }
    location ~* \.(py|bat|sh|conf|txt|md|log|bak)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;
}
